<div class="p-8">
  <h1 class="text-2xl font-bold mb-6">Customers</h1>

  <!-- Filters -->
  <div class="flex flex-wrap gap-4 mb-6">
    <input type="text" [(ngModel)]="search" (input)="onFilterChange()" placeholder="Search..." class="px-4 py-2 border rounded w-60" />

    <select [(ngModel)]="status" (change)="onFilterChange()" class="px-4 py-2 border rounded">
      <option value="">All Statuses</option>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>

    <input type="text" [(ngModel)]="os" (input)="onFilterChange()" placeholder="OS Version" class="px-4 py-2 border rounded w-40" />
  </div>

  <!-- Table -->
  <div class="bg-white p-6 rounded-xl shadow">
    <table class="min-w-full text-sm">
      <thead class="text-left text-gray-500 border-b">
        <tr>
          <th class="py-2 cursor-pointer" (click)="changeSort('organization_name')">Company</th>
          <th class="py-2">Email</th>
          <th class="py-2 cursor-pointer" (click)="changeSort('location')">Location</th>
          <th class="py-2">Status</th>
          <th class="py-2 cursor-pointer" (click)="changeSort('onboarded_date')">Onboarded</th>
          <th class="py-2">OS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of customers" class="border-b hover:bg-gray-50">
          <td class="py-2">{{ c.organization_name }}</td>
          <td class="py-2">{{ c.contact_email }}</td>
          <td class="py-2">{{ c.location }}</td>
          <td class="py-2">
            <span class="px-2 py-1 text-xs rounded-full font-bold"
              [ngClass]="{
                'bg-green-100 text-green-700': c.status === 'Active',
                'bg-red-100 text-red-700': c.status === 'Inactive'
              }">
              {{ c.status }}
            </span>
          </td>
          <td class="py-2">{{ c.onboarded_date | date: 'mediumDate' }}</td>
          <td class="py-2">{{ c.os_version_used }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-between items-center mt-4 text-sm">
    <button (click)="prevPage()" [disabled]="page === 1" class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Previous</button>
    <span>Page {{ page }}</span>
    <button (click)="nextPage()" class="px-4 py-2 bg-gray-200 rounded">Next</button>
  </div>
</div>
